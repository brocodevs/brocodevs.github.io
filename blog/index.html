<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("brocodev-theme");
                if (t !== "dark" && t !== "light") t = "dark";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Blog &mdash; BrocoDev</title>
    <meta name="description" content="Notes from BrocoDev." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blog — BrocoDev" />
    <meta property="og:description" content="Notes from BrocoDev." />
    <meta property="og:image" content="/posts/on-visual-design/cover.webp" />
    <meta name="theme-color" content="#08090C" />

    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet" />

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

    <link rel="preload" as="image" href="/assets/images/bg_dark.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/images/bg.webp" type="image/webp" />

    <link rel="stylesheet" href="/styles.css" />
</head>

<body class="blog-body">
    <main class="blog-page" id="blog-page">
        <header class="blog-header" id="blog-header">
            <h1 class="blog-header-title section-title-lg">Blog</h1>
            <p class="blog-header-subtitle section-sub-lg">
                My conscience, transcribed.
            </p>
        </header>

        <div class="blog-stage" id="blog-stage">
            <section class="blog-list-view" id="blog-list-view" aria-label="All blog posts">
                <div class="blog-filter-row" id="blog-filter-row" role="toolbar" aria-label="Filter posts by tag"></div>
                <div class="blog-list" id="blog-list"></div>
                <div class="blog-empty" id="blog-empty" hidden>
                    <iconify-icon icon="solar:stars-bold-duotone" class="blog-empty-icon"></iconify-icon>
                    <h2 class="blog-empty-title">No posts match these filters</h2>
                    <p class="blog-empty-sub">Try removing a tag or two.</p>
                    <button class="btn-pill" id="blog-clear-filters-btn" type="button">
                        <iconify-icon icon="solar:close-circle-bold-duotone"></iconify-icon>
                        <span>Clear filters</span>
                    </button>
                </div>
                <div class="blog-empty" id="blog-load-error" hidden>
                    <iconify-icon icon="solar:danger-circle-bold-duotone" class="blog-empty-icon"></iconify-icon>
                    <h2 class="blog-empty-title">Could not load posts</h2>
                    <p class="blog-empty-sub" id="blog-load-error-msg">
                        Something went wrong fetching the post index.
                    </p>
                    <button class="btn-pill" id="blog-retry-btn" type="button">
                        <iconify-icon icon="solar:refresh-bold-duotone"></iconify-icon>
                        <span>Try again</span>
                    </button>
                </div>
            </section>

            <article class="blog-detail-view" id="blog-detail-view" aria-label="Blog post" hidden>
                <div class="blog-detail-info">
                    <h1 class="blog-detail-title" id="blog-detail-title"></h1>
                    <p class="blog-detail-subtitle" id="blog-detail-subtitle"></p>
                    <div class="blog-detail-meta-row">
                        <div class="blog-detail-tags-inline" id="blog-detail-tags-inline"></div>
                        <div class="blog-detail-date-meta btn-pill btn-pill--sm" id="blog-detail-date-meta"></div>
                    </div>
                </div>
                <div class="blog-detail-cover-block" id="blog-detail-cover-block" hidden>
                    <img class="blog-detail-cover" id="blog-detail-cover-img" />
                </div>
                <div class="prose" id="blog-detail-content"></div>
                <div class="blog-detail-skeleton" id="blog-detail-skeleton" hidden>
                    <div class="blog-skel-line" style="width: 92%"></div>
                    <div class="blog-skel-line" style="width: 75%"></div>
                    <div class="blog-skel-line" style="width: 88%"></div>
                    <div class="blog-skel-line" style="width: 60%"></div>
                    <div class="blog-skel-line" style="width: 80%"></div>
                </div>
            </article>

            <article class="blog-detail-view blog-detail-404" id="blog-detail-404" aria-label="Post not found" hidden>
                <iconify-icon icon="solar:ghost-bold-duotone" class="blog-empty-icon"></iconify-icon>
                <h1 class="blog-empty-title">Post not found</h1>
                <p class="blog-empty-sub">
                    The post you were looking for doesn't exist or has been moved.
                </p>
            </article>
        </div>
    </main>

    <div class="progressive-blur-container" aria-hidden="true">
        <div class="blur-filter"></div>
        <div class="blur-filter"></div>
        <div class="blur-filter"></div>
        <div class="blur-filter"></div>
        <div class="blur-filter"></div>
    </div>

    <nav class="dock-container" aria-label="Blog navigation">
        <button class="dock-item" id="dock-blog-nav-btn" type="button" title="Back to Portfolio">
            <iconify-icon id="dock-blog-nav-icon" icon="solar:home-angle-bold-duotone"></iconify-icon>
        </button>
        <button class="dock-item" id="dock-theme-btn" type="button" title="Toggle Theme">
            <span class="dock-theme-icons">
                <iconify-icon icon="solar:sun-2-bold-duotone" class="theme-icon theme-icon-sun"></iconify-icon>
                <iconify-icon icon="solar:moon-stars-bold-duotone" class="theme-icon theme-icon-moon"></iconify-icon>
            </span>
        </button>
    </nav>

    <div class="wallpaper wallpaper-dark" aria-hidden="true"></div>
    <div class="wallpaper wallpaper-light" aria-hidden="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" defer></script>
    <script type="module" src="/js/blog.js"></script>
</body>

</html>
